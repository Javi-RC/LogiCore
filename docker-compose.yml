version: "3.9"

# LogiCore local development infrastructure.
# Provides PostgreSQL (one DB per service), Kafka, Zookeeper, and Kafka UI.
# Services themselves are added in a later phase of development.

services:
  # ---- PostgreSQL: one container, multiple databases (one per service) ----
  postgres:
    image: postgres:16
    container_name: logicore-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-logicore}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-logicore}
      POSTGRES_MULTIPLE_DATABASES: user_db,product_db,order_db,inventory_db,shipping_db,notification_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/postgres-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-logicore}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---- Kafka ----
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: logicore-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: logicore-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 72

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: logicore-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

volumes:
  postgres-data:
